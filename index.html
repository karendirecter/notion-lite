<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notion Lite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
  href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800;900&family=LXGW+WenKai:wght@400;700&display=swap"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <header class="ws">
            <div class="ws-avatar" aria-hidden="true">N</div>
            <div class="ws-meta">
              <div class="ws-name">Private Workspace</div>
              <div class="ws-sub">Just you</div>
            </div>
            <button class="icon-btn" id="collapseBtn" title="收起侧栏" aria-label="收起侧栏">
              <svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M12.7 5.3a1 1 0 0 1 0 1.4L9.4 10l3.3 3.3a1 1 0 0 1-1.4 1.4l-4-4a1 1 0 0 1 0-1.4l4-4a1 1 0 0 1 1.4 0Z"/></svg>
            </button>
          </header>

          <nav class="quick">
            <button class="quick-item" id="searchBtn">
              <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M9 3a6 6 0 1 0 3.9 10.6l3.7 3.7a1 1 0 0 0 1.4-1.4l-3.7-3.7A6 6 0 0 0 9 3Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
              <span>搜索</span>
              <kbd>⌘K</kbd>
            </button>
            <button class="quick-item" id="todayBtn">
              <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M5 3a1 1 0 0 1 2 0v1h6V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3Zm11 5H4v8h12V8Z"/></svg>
              <span>今天</span>
            </button>
          </nav>

          <div class="section">
            <div class="section-head">
              <span>页面</span>
              <button class="icon-btn small" id="newPageTopBtn" title="新建页面" aria-label="新建页面">
                <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M10 4a1 1 0 0 1 1 1v4h4a1 1 0 1 1 0 2h-4v4a1 1 0 1 1-2 0v-4H5a1 1 0 1 1 0-2h4V5a1 1 0 0 1 1-1Z"/></svg>
              </button>
            </div>
            <ul class="page-list" id="pageList"></ul>
            <button class="add-page" id="newPageBtn">
              <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M10 4a1 1 0 0 1 1 1v4h4a1 1 0 1 1 0 2h-4v4a1 1 0 1 1-2 0v-4H5a1 1 0 1 1 0-2h4V5a1 1 0 0 1 1-1Z"/></svg>
              <span>新建页面</span>
            </button>
          </div>

          <footer class="sidebar-foot">
            <button class="theme-toggle" id="themeToggle" title="切换主题">
              <span class="thumb"></span>
              <span class="lbl light"></span>
              <span class="lbl dark"></span>
            </button>
            <select class="font-select" id="fontPreset" title="字体风格">
              <option value="balanced">Inter + 中文</option>
              <option value="english">Classic English</option>
              <option value="chinese">中文阅读</option>
              <option value="handwritten">手写感</option>
            </select>
            <div class="hint">输入 / 打开菜单</div>
          </footer>
        </div>
        <div class="resizer" id="resizer"></div>
      </aside>

      <main class="main" id="main">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-btn" id="expandBtn" title="展开侧栏" aria-label="展开侧栏" hidden>
              <svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M3 5h14a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm0 4h14a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Zm0 4h14a1 1 0 1 1 0 2H3a1 1 0 1 1 0-2Z"/></svg>
            </button>
            <div class="crumbs" id="crumbs"></div>
          </div>
          <div class="topbar-right">
            <span class="saved" id="savedHint">已保存</span>
            <button class="ghost-btn" id="shareBtn">分享</button>
            <button class="icon-btn" id="moreBtn" title="更多">
              <svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M5 10a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm3.5 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Zm5 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z"/></svg>
            </button>
          </div>
        </header>

        <div class="canvas">
          <div class="page-layout">
            <aside class="page-outline" aria-label="页面目录">
              <div class="outline-head">目录</div>
              <div class="outline-body" id="outlineBody"></div>
            </aside>

            <div class="page-content">
              <div class="cover" id="cover"></div>
              <div class="page-head">
                <button class="icon-pick" id="iconPick" title="更换图标">
                  <span id="pageIcon">📄</span>
                </button>
                <div class="page-tools">
                  <button class="tool-btn" id="addCoverBtn">
                    <svg viewBox="0 0 20 20" width="14" height="14"><path fill="currentColor" d="M3 5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5Zm2 0v8l3-3 4 4 3-3 1 1V5H5Z"/></svg>
                    添加封面
                  </button>
                </div>
                <h1
                  class="page-title"
                  id="pageTitle"
                  contenteditable="true"
                  spellcheck="false"
                  data-placeholder="无标题"
                ></h1>
              </div>

              <div class="editor" id="editor"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="slash-menu" id="slashMenu" hidden>
      <div class="slash-head">基础块</div>
      <div class="slash-list" id="slashList"></div>
    </div>

    <div class="palette-mask" id="paletteMask" hidden>
      <div class="palette" role="dialog" aria-label="搜索">
        <div class="palette-input">
          <svg viewBox="0 0 20 20" width="16" height="16"><path fill="currentColor" d="M9 3a6 6 0 1 0 3.9 10.6l3.7 3.7a1 1 0 0 0 1.4-1.4l-3.7-3.7A6 6 0 0 0 9 3Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="paletteInput" placeholder="搜索页面或内容…" />
          <kbd>esc</kbd>
        </div>
        <div class="palette-results" id="paletteResults"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="image-preview-mask" id="imagePreviewMask" hidden>
      <div class="image-preview" role="dialog" aria-label="图片预览">
        <button class="image-preview-close" id="imagePreviewClose" aria-label="关闭预览">✕</button>
        <img id="imagePreviewImg" alt="图片预览" />
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
